name: guji_diff
description: "A robust collation engine for ancient and modern Chinese texts, supporting verbatim and structural comparison, variant character normalization, and statistical analysis. Platform-adaptive with native OpenCC FFI and Web OpenCC-JS support."
version: 0.1.1
homepage: https://github.com/sheldonlidev/guji-diff
repository: https://github.com/sheldonlidev/guji-diff
issue_tracker: https://github.com/sheldonlidev/guji-diff/issues
documentation: https://github.com/sheldonlidev/guji-diff#readme

topics:
  - chinese
  - text-comparison
  - collation
  - ancient-texts
  - opencc

environment:
  sdk: ^3.10.3
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  diff_match_patch: ^0.4.1
  opencc: ^1.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

